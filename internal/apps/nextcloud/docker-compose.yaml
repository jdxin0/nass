services:
  nextcloud:
    container_name: {{.Name}}
    image: nextcloud:33.0.3
    restart: unless-stopped
    environment:
      OVERWRITECLIURL: {{.PublicURL}}
      OVERWRITEPROTOCOL: {{.PublicScheme}}
      OVERWRITEHOST: {{.PublicHost}}
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: {{.AdminPassword}}
      NEXTCLOUD_TRUSTED_DOMAINS: {{.PublicHost}} 127.0.0.1
    ports:
      - "127.0.0.1:{{.BackendPort}}:80"
    volumes:
      - {{.DataRoot}}:/var/www/html
    extra_hosts:
      # Let nextcloud reach the OIDC issuer running on the host.
      - "auth.{{.BaseHost}}:host-gateway"
      - "{{.BaseHost}}:host-gateway"
