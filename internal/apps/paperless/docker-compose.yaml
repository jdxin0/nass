services:
  paperless:
    container_name: {{.Name}}
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBPORT: "5432"
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: {{.AdminPassword}}
      PAPERLESS_SECRET_KEY: {{.AdminPassword}}
      PAPERLESS_URL: {{.PublicURL}}
      PAPERLESS_ALLOWED_HOSTS: "{{.Subdomain}}.{{.BaseHost}}"
      PAPERLESS_CORS_ALLOWED_HOSTS: {{.PublicURL}}
      PAPERLESS_TIME_ZONE: UTC
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD: {{.AdminPassword}}
      PAPERLESS_ADMIN_MAIL: admin@{{.BaseHost}}
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIAL_AUTO_SIGNUP: "True"
      PAPERLESS_ACCOUNT_DEFAULT_HTTP_PROTOCOL: https
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: '{"openid_connect":{"APPS":[{"provider_id":"nass","name":"nass","client_id":"{{.OIDCClientID}}","secret":"{{.OIDCClientSecret}}","settings":{"server_url":"{{.OIDCDiscoveryURL}}"}}]}}'
    ports:
      - "127.0.0.1:{{.BackendPort}}:8000"
    volumes:
      - {{.DataRoot}}/data:/usr/src/paperless/data
      - {{.DataRoot}}/media:/usr/src/paperless/media
      - {{.DataRoot}}/export:/usr/src/paperless/export
      - {{.DataRoot}}/consume:/usr/src/paperless/consume
    extra_hosts:
      - "auth.{{.BaseHost}}:host-gateway"
      - "{{.BaseHost}}:host-gateway"

  postgres:
    container_name: {{.Name}}_postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: {{.AdminPassword}}
      POSTGRES_DB: paperless
    volumes:
      - {{.DataRoot}}/postgres:/var/lib/postgresql/data

  redis:
    container_name: {{.Name}}_redis
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - {{.DataRoot}}/redis:/data
