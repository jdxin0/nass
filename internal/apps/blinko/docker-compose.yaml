services:
  blinko:
    container_name: {{.Name}}
    image: blinkospace/blinko:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: {{.PublicURL}}
      NEXT_PUBLIC_BASE_URL: {{.PublicURL}}
      NEXTAUTH_SECRET: {{.AdminPassword}}
      DATABASE_URL: postgresql://postgres:postgres@{{.Name}}_postgres:5432/postgres
    ports:
      - "127.0.0.1:{{.BackendPort}}:1111"
    volumes:
      - {{.DataRoot}}/app:/app/.blinko
    extra_hosts:
      - "auth.{{.BaseHost}}:host-gateway"
      - "{{.BaseHost}}:host-gateway"

  postgres:
    container_name: {{.Name}}_postgres
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 10s
      retries: 5
    volumes:
      - {{.DataRoot}}/postgres:/var/lib/postgresql/data
