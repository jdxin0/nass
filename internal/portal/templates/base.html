{{define "base"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{.Title}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f4f7fb; --card:#fff; --text:#18202f; --muted:#667085; --border:#d8dee8; --primary:#2563eb; --primary-hover:#1d4ed8; --danger:#c2410c; --success:#15803d; --surface:#eef2f7; --shadow:0 18px 50px rgba(15,23,42,.12); --soft-shadow:0 10px 28px rgba(15,23,42,.08); }
  * { box-sizing: border-box; }
  body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); margin: 0; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.88); border-bottom: 1px solid rgba(216,222,232,.8); padding: .85rem 1.5rem; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(14px); }
  header a { color: var(--text); text-decoration: none; font-weight: 700; }
  header nav { display: flex; align-items: center; gap: .75rem; }
  header nav a { font-weight: 600; color: var(--muted); }
  main { max-width: 1120px; margin: 0 auto; padding: 2rem 1rem 3rem; }
  h1 { font-size: 2rem; line-height: 1.15; margin: 0; }
  h2 { font-size: 1rem; margin: 0 0 1rem; }
  p { line-height: 1.5; }
  body.login-page { min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 20% 10%, #dbeafe 0, transparent 34%), radial-gradient(circle at 80% 80%, #dcfce7 0, transparent 30%), #f8fafc; }
  body.login-page main { width: min(100%, 460px); margin: 0; padding: 1rem; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
  .eyebrow { color: var(--primary); font-size: .78rem; font-weight: 800; letter-spacing: .08em; margin: 0 0 .45rem; text-transform: uppercase; }
  .subtle { color: var(--muted); margin: .35rem 0 0; }
  .panel { background: rgba(255,255,255,.92); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; box-shadow: var(--soft-shadow); margin-bottom: 1.25rem; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 1.25rem; align-items: start; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1.15rem; text-decoration: none; color: inherit; transition: transform .14s, box-shadow .14s, border-color .14s; display: block; min-height: 155px; }
  .card:hover { transform: translateY(-3px); box-shadow: var(--soft-shadow); border-color: #aeb9ca; }
  .card .icon { width: 42px; height: 42px; border-radius: 8px; display: grid; place-items: center; background: var(--surface); font-size: 1.55rem; }
  .card .title { font-weight: 750; margin: .8rem 0 .25rem; }
  .card .desc { font-size: .88rem; color: var(--muted); min-height: 2.5em; }
  .empty { background: var(--card); border: 1px dashed #b8c2d2; border-radius: 8px; padding: 2rem; color: var(--muted); }
  .badge { display: inline-block; padding: .18rem .55rem; border-radius: 999px; font-size: .72rem; font-weight: 750; }
  .badge.running { background: #dcfce7; color: var(--success); }
  .badge.stopped { background: #ffedd5; color: var(--danger); }
  .badge.unknown { background: #e5e7eb; color: #4b5563; }
  .user-pill { color: var(--muted); font-size: .86rem; background: var(--surface); border: 1px solid var(--border); padding: .35rem .6rem; border-radius: 999px; }
  form.login { background: rgba(255,255,255,.94); padding: 2rem; border-radius: 8px; border: 1px solid rgba(216,222,232,.9); width: 100%; margin: 0 auto; box-shadow: var(--shadow); }
  form.login h1 { margin: 0 0 .35rem; font-size: 1.6rem; }
  form.login .subtitle { margin: 0 0 1.5rem; color: var(--muted); font-size: .94rem; }
  form.login label { margin-top: 1rem; font-weight: 650; color: var(--text); }
  label { display: block; margin: .75rem 0 .25rem; font-size: .84rem; color: var(--muted); font-weight: 650; }
  input[type=text], input[type=password], input[type=email], input[type=url], input[type=number] { width: 100%; padding: .68rem .75rem; border: 1px solid var(--border); border-radius: 6px; font-size: .95rem; display: block; background: #fff; }
  input[type=checkbox] { width: 1rem; height: 1rem; vertical-align: middle; }
  input:focus { outline: 2px solid rgba(45,108,223,.22); border-color: var(--primary); }
  button, .btn { background: var(--primary); color: #fff; border: 0; padding: .56rem .9rem; border-radius: 6px; cursor: pointer; font-size: .9rem; font-weight: 700; text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { background: var(--primary-hover); }
  button.danger { background: var(--danger); }
  button.secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .err { background: #fff7ed; color: var(--danger); border: 1px solid #fed7aa; padding: .7rem .8rem; border-radius: 6px; margin: .75rem 0; font-size: .9rem; }
  .ok  { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; padding: .7rem .8rem; border-radius: 6px; margin: .75rem 0; font-size: .9rem; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: .72rem .8rem; text-align: left; border-bottom: 1px solid var(--border); font-size: .9rem; vertical-align: top; }
  th { background: #f8fafc; font-weight: 750; color: #475467; }
  tr:last-child td { border-bottom: 0; }
  .actions { white-space: nowrap; }
  .actions form { display: inline-block; margin-right: .25rem; margin-bottom: .25rem; }
  .inline-fields { display: grid; grid-template-columns: minmax(120px, 1fr) auto; gap: .5rem; align-items: end; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
  .form-grid .wide { grid-column: 1 / -1; }
  @media (max-width: 820px) {
    header { align-items: flex-start; gap: .75rem; flex-direction: column; }
    header nav { flex-wrap: wrap; }
    main { padding-top: 1.25rem; }
    .page-head, .split { display: block; }
    .form-grid { grid-template-columns: 1fr; }
    table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body{{if .BodyClass}} class="{{.BodyClass}}"{{end}}>
{{if .User}}
<header>
  <a href="/">{{.SiteTitle}}</a>
  <nav>
    {{if .User.IsAdmin}}<a href="/portal/admin">admin</a>{{end}}
    <span class="user-pill">{{.User.Username}}</span>
    <form method="POST" action="/portal/logout" style="display:inline">
      <button type="submit" class="secondary" style="padding:.3rem .6rem;font-size:.8rem">sign out</button>
    </form>
  </nav>
</header>
{{end}}
<main>
{{template "content" .}}
</main>
</body>
</html>{{end}}
