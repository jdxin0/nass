{{define "base"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{.Title}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg:#f4f7fb; --card:#fff; --text:#18202f; --muted:#667085;
    --border:#d8dee8; --primary:#2563eb; --primary-hover:#1d4ed8;
    --danger:#c2410c; --success:#15803d; --surface:#eef2f7;
    --shadow:0 18px 50px rgba(15,23,42,.12);
    --soft-shadow:0 10px 28px rgba(15,23,42,.08);
    --header-bg:rgba(255,255,255,.88); --panel-bg:rgba(255,255,255,.92);
    --login-bg:radial-gradient(circle at 20% 10%, #dbeafe 0, transparent 34%), radial-gradient(circle at 80% 80%, #dcfce7 0, transparent 30%), #f8fafc;
    --th-bg:#f8fafc;
    --dot-running:#22c55e; --dot-stopped:#f97316; --dot-error:#ef4444; --dot-unknown:#94a3b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1419; --card:#161e2c; --text:#e6e9f0; --muted:#94a3b8;
      --border:#2a3344; --primary:#3b82f6; --primary-hover:#60a5fa;
      --danger:#f97316; --success:#22c55e; --surface:#1f2735;
      --shadow:0 18px 50px rgba(0,0,0,.45);
      --soft-shadow:0 8px 24px rgba(0,0,0,.35);
      --header-bg:rgba(22,30,44,.85); --panel-bg:rgba(22,30,44,.92);
      --login-bg:radial-gradient(circle at 20% 10%, #1e3a8a33 0, transparent 34%), radial-gradient(circle at 80% 80%, #14532d33 0, transparent 30%), #0b0f15;
      --th-bg:#1c2433;
    }
  }
  * { box-sizing: border-box; }
  body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); margin: 0; }
  header { position: sticky; top: 0; z-index: 10; background: var(--header-bg); border-bottom: 1px solid var(--border); padding: .55rem 1.25rem; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(14px); }
  header a { color: var(--text); text-decoration: none; font-weight: 700; }
  header nav { display: flex; align-items: center; gap: .75rem; }
  header nav a { font-weight: 600; color: var(--muted); }
  .user-menu { position: relative; }
  .user-button { width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; background: var(--text); color: var(--bg); font-weight: 800; font-size: .85rem; border: 0; cursor: pointer; }
  .user-popover { display: none; position: absolute; right: 0; top: calc(100% + .55rem); width: 180px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--soft-shadow); padding: .45rem; }
  .user-menu:hover .user-popover, .user-menu:focus-within .user-popover { display: block; }
  .user-popover .name { color: var(--muted); font-size: .82rem; padding: .45rem .55rem; border-bottom: 1px solid var(--border); margin-bottom: .35rem; }
  .user-popover a, .user-popover button { width: 100%; display: block; text-align: left; background: transparent; color: var(--text); border: 0; padding: .48rem .55rem; border-radius: 6px; font-size: .9rem; font-weight: 650; cursor: pointer; }
  .user-popover a:hover, .user-popover button:hover { background: var(--surface); }
  main { max-width: 1120px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  h1 { font-size: 1.6rem; line-height: 1.2; margin: 0; }
  h2 { font-size: 1rem; margin: 0 0 1rem; }
  p { line-height: 1.5; }
  body.login-page { min-height: 100vh; display: grid; place-items: center; background: var(--login-bg); }
  body.login-page main { width: min(100%, 460px); margin: 0; padding: 1rem; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
  .eyebrow { color: var(--primary); font-size: .72rem; font-weight: 800; letter-spacing: .08em; margin: 0 0 .25rem; text-transform: uppercase; }
  .subtle { color: var(--muted); margin: .25rem 0 0; font-size: .9rem; }
  .panel { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; box-shadow: var(--soft-shadow); margin-bottom: 1.25rem; }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 1.25rem; align-items: start; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: .85rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: .95rem 1rem; text-decoration: none; color: inherit; transition: transform .14s, box-shadow .14s, border-color .14s, background .14s; display: flex; flex-direction: column; gap: .35rem; }
  .card:hover { transform: translateY(-2px); box-shadow: var(--soft-shadow); border-color: var(--primary); background: var(--panel-bg); }
  .card .row { display: flex; align-items: center; gap: .7rem; }
  .card .icon { width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; background: var(--surface); font-size: 1.35rem; flex: 0 0 auto; }
  .card .title { font-weight: 700; font-size: .98rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .desc { font-size: .82rem; color: var(--muted); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .dot { width: 8px; height: 8px; border-radius: 999px; flex: 0 0 auto; background: var(--dot-unknown); }
  .dot.running, .dot.done { background: var(--dot-running); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot-running) 25%, transparent); }
  .dot.stopped { background: var(--dot-stopped); }
  .dot.error { background: var(--dot-error); }
  .empty { background: var(--card); border: 1px dashed var(--border); border-radius: 8px; padding: 2rem; color: var(--muted); }
  .badge { display: inline-block; padding: .18rem .55rem; border-radius: 999px; font-size: .72rem; font-weight: 750; }
  .badge.running, .badge.done { background: color-mix(in srgb, var(--success) 18%, transparent); color: var(--success); }
  .badge.error, .badge.stopped { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
  .badge.unknown { background: var(--surface); color: var(--muted); }
  .user-pill { color: var(--muted); font-size: .86rem; background: var(--surface); border: 1px solid var(--border); padding: .35rem .6rem; border-radius: 999px; }
  form.login { background: var(--panel-bg); padding: 2rem; border-radius: 8px; border: 1px solid var(--border); width: 100%; margin: 0 auto; box-shadow: var(--shadow); }
  form.login h1 { margin: 0 0 .35rem; font-size: 1.6rem; }
  form.login .subtitle { margin: 0 0 1.5rem; color: var(--muted); font-size: .94rem; }
  form.login label { margin-top: 1rem; font-weight: 650; color: var(--text); }
  label { display: block; margin: .75rem 0 .25rem; font-size: .84rem; color: var(--muted); font-weight: 650; }
  input[type=text], input[type=password], input[type=email], input[type=url], input[type=number] { width: 100%; padding: .68rem .75rem; border: 1px solid var(--border); border-radius: 6px; font-size: .95rem; display: block; background: var(--card); color: var(--text); }
  input[type=checkbox] { width: 1rem; height: 1rem; vertical-align: middle; }
  input:focus { outline: 2px solid color-mix(in srgb, var(--primary) 30%, transparent); border-color: var(--primary); }
  button, .btn { background: var(--primary); color: #fff; border: 0; padding: .56rem .9rem; border-radius: 6px; cursor: pointer; font-size: .9rem; font-weight: 700; text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { background: var(--primary-hover); }
  button.danger { background: var(--danger); }
  button.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover { background: var(--surface); }
  .err { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent); padding: .7rem .8rem; border-radius: 6px; margin: .75rem 0; font-size: .9rem; }
  .ok  { background: color-mix(in srgb, var(--success) 12%, transparent); color: var(--success); border: 1px solid color-mix(in srgb, var(--success) 30%, transparent); padding: .7rem .8rem; border-radius: 6px; margin: .75rem 0; font-size: .9rem; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: .72rem .8rem; text-align: left; border-bottom: 1px solid var(--border); font-size: .9rem; vertical-align: top; }
  th { background: var(--th-bg); font-weight: 750; color: var(--muted); }
  tr:last-child td { border-bottom: 0; }
  .actions { white-space: nowrap; }
  .actions form { display: inline-block; margin-right: .25rem; margin-bottom: .25rem; }
  .cell-stack { display: flex; flex-direction: column; gap: .15rem; }
  .muted { color: var(--muted); }
  .small { font-size: .8rem; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .8rem; color: var(--muted); }
  .status { display: inline-flex; align-items: center; gap: .4rem; font-size: .85rem; color: var(--muted); }
  button.mini, .btn.mini { padding: .3rem .6rem; font-size: .78rem; }
  .action-sep { display: inline-block; width: 1px; height: 18px; background: var(--border); vertical-align: middle; margin: 0 .35rem; }
  .check-inline { margin: 0; color: var(--text); display: inline-flex; align-items: center; gap: .35rem; white-space: nowrap; }
  .admin-apps td { vertical-align: middle; }
  .user-list { list-style: none; padding: 0; margin: 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--card); }
  .user-row { display: grid; grid-template-columns: minmax(180px, 1fr) minmax(280px, 2fr) auto; gap: 1rem; align-items: center; padding: .75rem 1rem; border-bottom: 1px solid var(--border); }
  .user-row:last-child { border-bottom: 0; }
  .user-ident { display: flex; align-items: center; gap: .7rem; min-width: 0; }
  .user-avatar { width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; background: var(--surface); color: var(--text); font-weight: 800; flex: 0 0 auto; text-transform: uppercase; }
  .user-edit { display: flex; align-items: center; gap: .55rem; flex-wrap: wrap; }
  .user-edit input[type=email] { flex: 1 1 220px; min-width: 0; padding: .45rem .6rem; font-size: .88rem; }
  .user-actions { display: flex; align-items: center; gap: .5rem; justify-content: flex-end; }
  details.reveal { position: relative; }
  details.reveal > summary { list-style: none; cursor: pointer; user-select: none; }
  details.reveal > summary::-webkit-details-marker { display: none; }
  details.reveal > summary.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: .3rem .6rem; border-radius: 6px; font-size: .78rem; font-weight: 700; display: inline-block; }
  details.reveal > summary.secondary:hover { background: var(--surface); }
  details.reveal[open] > summary.secondary { background: var(--surface); border-color: var(--primary); }
  details.reveal .reveal-body { display: flex; align-items: center; gap: .4rem; margin-top: .5rem; padding: .55rem; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; position: absolute; right: 0; top: 100%; z-index: 5; box-shadow: var(--soft-shadow); }
  details.reveal .reveal-body input { padding: .4rem .55rem; font-size: .85rem; width: 200px; }
  .user-create { margin-top: 1rem; padding: 1rem; background: var(--surface); border: 1px dashed var(--border); border-radius: 8px; }
  .user-create-grid { display: grid; grid-template-columns: 1fr 1fr 1fr auto auto; gap: .65rem; align-items: end; }
  .user-create-grid label { margin: 0; }
  @media (max-width: 820px) {
    .user-row { grid-template-columns: 1fr; }
    .user-actions { justify-content: flex-start; }
    details.reveal .reveal-body { position: static; }
    .user-create-grid { grid-template-columns: 1fr; }
  }
  .inline-fields { display: grid; grid-template-columns: minmax(120px, 1fr) auto; gap: .5rem; align-items: end; }
  .user-row-fields { display: grid; grid-template-columns: minmax(130px, 1fr) minmax(160px, 1fr) minmax(130px, 1fr) auto auto; gap: .55rem; align-items: end; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
  .form-grid .wide { grid-column: 1 / -1; }
  @media (max-width: 820px) {
    header { align-items: flex-start; gap: .75rem; flex-direction: column; }
    header nav { flex-wrap: wrap; }
    main { padding-top: 1.25rem; }
    .page-head, .split { display: block; }
    .user-row-fields { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    table { display: block; overflow-x: auto; }
  }
</style>
</head>
<body{{if .BodyClass}} class="{{.BodyClass}}"{{end}}>
{{if .User}}
<header>
  <a href="/">{{.SiteTitle}}</a>
  <nav>
    <div class="user-menu">
      <button type="button" class="user-button" aria-label="User menu">{{printf "%.1s" .User.Username}}</button>
      <div class="user-popover">
        <div class="name">{{.User.Username}}</div>
        {{if .User.IsAdmin}}<a href="/portal/admin">Admin</a>{{end}}
        <form method="POST" action="/portal/logout">
          <button type="submit">Sign out</button>
        </form>
      </div>
    </div>
  </nav>
</header>
{{end}}
<main>
{{template "content" .}}
</main>
</body>
</html>{{end}}
